<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ассистент Парковки</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Парковка">
    
    <!-- Иконки для всех платформ -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo-gradient.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logo-gradient.png">
    <link rel="apple-touch-icon" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="152x152" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="167x167" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="120x120" href="logo-gradient.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            width: 100%;
            max-width: 28rem;
            margin: 0 auto;
        }
        .datetime {
            background: rgba(30,41,59,0.5);
            border: 1px solid #334155;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 12px;
            white-space: nowrap;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 12px;
        }
        .timer {
            width: 100%;
            background: rgba(30,41,59,0.6);
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
        .timer-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        .timer-value {
            font-size: 24px;
            font-family: ui-monospace, monospace;
            font-weight: 700;
            color: #fbbf24;
        }
        .timer-value.urgent { color: #f87171; }
        .road {
            width: 100%;
            height: 384px;
            background: #475569;
            border-radius: 24px;
            border: 4px solid #64748b;
            display: flex;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .divider {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            width: 8px;
            margin-left: -4px;
            border-left: 8px dashed #cbd5e1;
            opacity: 0.6;
            z-index: 10;
            border-radius: 999px;
        }
        .lane {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            background: rgba(30,41,59,0.8);
            transition: all 0.5s;
            overflow: hidden;
        }
        .lane.ok { background: rgba(30,41,59,1); box-shadow: inset 0 4px 0 rgba(34,197,94,0.6); }
        .lane.warn { box-shadow: inset 0 4px 0 rgba(234,179,8,0.6); }
        .lane.disabled { opacity: 0.4; }
        .lane-label {
            position: absolute;
            top: 8px;
            color: #cbd5e1;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-align: center;
            z-index: 20;
        }
        .lane-label small { font-size: 9px; color: #94a3b8; display: block; }
        .content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 24px;
        }
        .badge {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            background: rgba(15,23,42,0.9);
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: textSlideIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards;
            opacity: 0;
            line-height: 1.3;
        }
        .badge.green { color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .badge.red { color: #f87171; border: 1px solid rgba(239,68,68,0.5); background: rgba(239,68,68,0.1); }
        .badge.yellow { color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
        .icon {
            width: 24px;
            height: 24px;
            padding: 6px;
            border-radius: 50%;
            margin-top: 12px;
            animation: iconBounce 0.7s cubic-bezier(0.68,-0.55,0.265,1.55) 1s forwards;
            opacity: 0;
        }
        .icon.ok { background: rgba(34,197,94,0.9); box-shadow: 0 0 15px rgba(34,197,94,0.8); }
        .icon.bad { background: rgba(239,68,68,0.9); box-shadow: 0 0 15px rgba(239,68,68,0.8); }
        .icon.warn { background: rgba(234,179,8,0.9); box-shadow: 0 0 15px rgba(234,179,8,0.8); }
        .icon svg { width: 100%; height: 100%; stroke: white; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(8px);
            padding: 8px 16px 16px;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: center;
            z-index: 20;
        }
        .refresh-btn {
            width: 100%;
            max-width: 28rem;
            background: #334155;
            color: white;
            font-size: 18px;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .refresh-btn:active { transform: scale(0.98); background: #1e293b; }
        .refresh-btn svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes driveIn {
            0% { transform: translateY(200px); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes headlightsOn {
            0%, 70% { filter: drop-shadow(0 0 12px #fef08a) drop-shadow(0 0 25px #fef9c3) drop-shadow(0 0 40px #fef08a); }
            100% { filter: none; }
        }
        @keyframes taillightsOn {
            0%, 70% { filter: drop-shadow(0 0 10px #ef4444) drop-shadow(0 0 20px #ef4444); }
            100% { filter: none; }
        }
        @keyframes beamFade {
            0%, 15% { opacity: 0; }
            25%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes textSlideIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.8); }
            60% { transform: translateY(4px) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes iconBounce {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            60% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            80% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .car-wrap {
            position: relative;
            animation: driveIn 1.3s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
            opacity: 0;
        }
        .headlight { animation: headlightsOn 1.3s ease-out forwards; }
        .taillight { animation: taillightsOn 1.3s ease-out forwards; }
        .beam {
            position: absolute;
            top: -64px;
            width: 32px;
            height: 64px;
            background: linear-gradient(to top, rgba(254,240,138,0.85), rgba(254,240,138,0.3) 40%, transparent);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            animation: beamFade 1.3s ease-out forwards;
            opacity: 0;
        }
        .beam.left { left: 8px; }
        .beam.right { right: 8px; }
    </style>
</head>
<body>
    <main class="app">
        <div id="current-datetime" class="datetime">Загрузка...</div>
        <h1>Нагорное шоссе</h1>
        <div class="timer">
            <div id="timer-title" class="timer-title">...</div>
            <div id="timer-value" class="timer-value">--:--:--</div>
        </div>
        <div class="road">
            <div class="divider"></div>
            <div id="left-lane" class="lane">
                <div class="lane-label">Слева<small>(I, нечет)</small></div>
                <div id="left-road-content" class="content"></div>
            </div>
            <div id="right-lane" class="lane">
                <div class="lane-label">Справа<small>(II, чет)</small></div>
                <div id="right-road-content" class="content"></div>
            </div>
        </div>
    </main>

    <div class="footer">
        <button onclick="location.reload()" class="refresh-btn">
            <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Обновить
        </button>
    </div>

    <script>
        // PWA Манифест для установки на рабочий стол
        const manifestData = {
            "name": "Ассистент Парковки",
            "short_name": "Парковка",
            "description": "Помощник парковки на Нагорном шоссе",
            "start_url": ".",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [
                { "src": "logo-gradient.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
                { "src": "logo-gradient.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
                { "src": "logo-gradient.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        function createCar(num, delay) {
            const d = delay ? `style="animation-delay:${delay}s"` : '';
            return `
                <div class="car-wrap" ${d}>
                    <div class="beam left" ${d}></div>
                    <div class="beam right" ${d}></div>
                    <svg viewBox="0 0 100 200" width="80" height="160" style="display:block;filter:drop-shadow(0 10px 15px rgba(0,0,0,0.5))">
                        <defs>
                            <linearGradient id="bg${num}" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#fff"/>
                                <stop offset="50%" stop-color="#e2e8f0"/>
                                <stop offset="100%" stop-color="#94a3b8"/>
                            </linearGradient>
                            <linearGradient id="gl${num}" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#60a5fa"/>
                                <stop offset="100%" stop-color="#1e3a8a"/>
                            </linearGradient>
                        </defs>
                        <ellipse cx="50" cy="195" rx="38" ry="3" fill="#000" opacity="0.4"/>
                        <rect x="6" y="38" width="11" height="26" rx="3" fill="#0f172a"/>
                        <rect x="83" y="38" width="11" height="26" rx="3" fill="#0f172a"/>
                        <rect x="6" y="138" width="11" height="26" rx="3" fill="#0f172a"/>
                        <rect x="83" y="138" width="11" height="26" rx="3" fill="#0f172a"/>
                        <rect x="14" y="10" width="72" height="180" rx="22" fill="url(#bg${num})" stroke="#64748b" stroke-width="1.5"/>
                        <rect x="22" y="58" width="56" height="88" rx="12" fill="#1e293b"/>
                        <path d="M 26 58 L 74 58 L 70 42 L 30 42 Z" fill="url(#gl${num})" opacity="0.9"/>
                        <path d="M 30 42 L 70 42 L 68 46 L 32 46 Z" fill="#93c5fd" opacity="0.5"/>
                        <path d="M 26 146 L 74 146 L 70 162 L 30 162 Z" fill="url(#gl${num})" opacity="0.9"/>
                        <rect x="36" y="14" width="28" height="8" rx="2" fill="#0f172a"/>
                        <ellipse cx="26" cy="20" rx="7" ry="5" fill="#fef9c3" class="headlight" ${d}/>
                        <ellipse cx="74" cy="20" rx="7" ry="5" fill="#fef9c3" class="headlight" ${d}/>
                        <ellipse cx="26" cy="20" rx="4" ry="3" fill="#fff"/>
                        <ellipse cx="74" cy="20" rx="4" ry="3" fill="#fff"/>
                        <rect x="20" y="182" width="14" height="6" rx="2" fill="#ef4444" class="taillight" ${d}/>
                        <rect x="66" y="182" width="14" height="6" rx="2" fill="#ef4444" class="taillight" ${d}/>
                        <rect x="40" y="178" width="20" height="8" rx="1" fill="#f8fafc"/>
                    </svg>
                </div>`;
        }

        const icons = {
            ok: `<div class="icon ok"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>`,
            bad: `<div class="icon bad"><svg viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg></div>`,
            warn: `<div class="icon warn"><svg viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M12 3l9 16H3L12 3z"/></svg></div>`
        };

        function badge(text, color) {
            return `<div class="badge ${color}">${text}</div>`;
        }

        function calculateLogic() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-datetime').textContent = `${dateStr} • ${timeStr}`;

            const isChangeover = now.getHours() >= 21;
            const todayOdd = now.getDate() % 2 !== 0;
            const tomorrowOdd = !todayOdd; // Следующий день всегда противоположной четности

            // Левая сторона (I) для нечетных, Правая (II) для четных
            const currentValidLeft = todayOdd;
            const currentValidRight = !todayOdd;
            
            const nextValidLeft = tomorrowOdd;
            const nextValidRight = !tomorrowOdd;

            return { isChangeover, currentValidLeft, currentValidRight, nextValidLeft, nextValidRight };
        }

        function drawRoad({ isChangeover, currentValidLeft, currentValidRight, nextValidLeft, nextValidRight }) {
            const leftC = document.getElementById('left-road-content');
            const rightC = document.getElementById('right-road-content');
            const leftL = document.getElementById('left-lane');
            const rightL = document.getElementById('right-lane');

            leftC.innerHTML = '';
            rightC.innerHTML = '';
            leftL.className = 'lane';
            rightL.className = 'lane';

            if (isChangeover) {
                // С 21:00 до 00:00: Парковка разрешена с обеих сторон (рисуем 2 машинки)
                // Но одна сторона станет запрещенной после 00:00
                
                if (nextValidLeft) {
                    // Левая сторона будет разрешена после 00:00
                    leftL.classList.add('ok');
                    leftC.innerHTML = badge('Можно (останется после 00:00)', 'green') + createCar(1, 0) + icons.ok;
                } else {
                    // Левую сторону нужно освободить до 00:00
                    leftL.classList.add('warn');
                    leftC.innerHTML = badge('Перепарковать на другую сторону до 00:00', 'red') + createCar(1, 0.2) + icons.warn;
                }

                if (nextValidRight) {
                    // Правая сторона будет разрешена после 00:00
                    rightL.classList.add('ok');
                    rightC.innerHTML = badge('Можно (останется после 00:00)', 'green') + createCar(2, 0) + icons.ok;
                } else {
                    // Правую сторону нужно освободить до 00:00
                    rightL.classList.add('warn');
                    rightC.innerHTML = badge('Перепарковать на другую сторону до 00:00', 'red') + createCar(2, 0.2) + icons.warn;
                }
            } else {
                // С 00:00 до 21:00: Парковка разрешена только с одной стороны (рисуем 1 машинку)
                
                if (currentValidLeft) {
                    leftL.classList.add('ok');
                    leftC.innerHTML = badge('Можно парковаться', 'green') + createCar(1, 0) + icons.ok;
                } else {
                    leftL.classList.add('disabled');
                    leftC.innerHTML = badge('Нельзя', 'red') + icons.bad;
                }

                if (currentValidRight) {
                    rightL.classList.add('ok');
                    rightC.innerHTML = badge('Можно парковаться', 'green') + createCar(2, 0) + icons.ok;
                } else {
                    rightL.classList.add('disabled');
                    rightC.innerHTML = badge('Нельзя', 'red') + icons.bad;
                }
            }
        }

        function updateTimerLive() {
            const now = new Date();
            const target = new Date(now);
            const isChangeover = now.getHours() >= 21;
            const title = document.getElementById('timer-title');
            const value = document.getElementById('timer-value');

            if (isChangeover) {
                target.setDate(target.getDate() + 1);
                target.setHours(0, 0, 0, 0);
                title.textContent = "До окончания перестановки (00:00):";
                value.classList.add('urgent');
            } else {
                target.setHours(21, 0, 0, 0);
                title.textContent = "До начала перестановки (21:00):";
                value.classList.remove('urgent');
            }

            let diff = Math.max(0, target - now);
            const h = Math.floor(diff / 3600000) % 24;
            const m = Math.floor(diff / 60000) % 60;
            const s = Math.floor(diff / 1000) % 60;
            value.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        let lastState = null;
        function tick() {
            const logic = calculateLogic();
            updateTimerLive();
            
            // Проверяем, изменилось ли состояние, чтобы не перерисовывать DOM каждую секунду
            const currentState = `${logic.isChangeover}-${logic.currentValidLeft}-${logic.nextValidLeft}`;
            if (lastState !== currentState) {
                drawRoad(logic);
                lastState = currentState;
            }
        }

        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
