<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Парковочный ассистент</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Парковка">
    <meta name="description" content="Помощник для парковки по четным и нечетным дням с учетом пересменки">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Smooth transitions for the result card */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pulse animation for the button */
        .btn-pulse:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col antialiased selection:bg-blue-500 font-sans relative">

    <!-- Background Decoration -->
    <div class="absolute inset-0 z-0 flex items-center justify-center opacity-5">
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
    </div>

    <!-- Top Info / Notification Area -->
    <div id="notification-panel" class="fixed top-0 left-0 w-full z-50 transform -translate-y-full transition-transform duration-300 ease-out flex justify-center">
        <div class="bg-slate-800 text-slate-100 w-full max-w-md mx-auto rounded-b-3xl shadow-2xl shadow-black/80 border-b border-x border-slate-700 p-6 flex flex-col gap-4 relative">
            
            <!-- Close Button -->
            <button onclick="closeNotification()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-white rounded-full bg-slate-700/50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <!-- Current Date and Time -->
            <div class="text-center w-full mt-2">
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-1">Сейчас</p>
                <p class="text-2xl font-bold text-white flex items-center justify-center gap-2">
                    <span id="popup-date">--</span>
                    <span class="text-blue-400">•</span>
                    <span id="popup-time">--:--</span>
                </p>
            </div>

            <div class="flex flex-col items-center justify-center text-center gap-2 mt-2 pb-4">
                <div id="side-icon" class="p-4 bg-blue-500/20 text-blue-400 rounded-full mb-1 inline-block">
                    <!-- Icon injected by JS -->
                </div>
                <h2 id="side-title" class="text-3xl font-bold text-white mb-1">...</h2>
                <p id="day-type" class="text-base font-semibold text-blue-400 uppercase tracking-wider mb-3">...</p>
                <p id="result-text" class="text-2xl font-medium text-slate-200 leading-snug"></p>
            </div>
            
            <!-- Swipe handle decoration -->
            <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mt-2"></div>
        </div>
    </div>

    <!-- Main Content Area (Visual Center) -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto">
        <div class="text-center mb-12 w-full">
            <h2 class="text-xl font-semibold text-slate-300 mb-2">Нагорное шоссе</h2>
            
            <!-- Traffic Signs -->
            <div class="flex justify-center gap-6 my-6">
                <!-- Sign 3.29 (Odd days) -->
                <svg viewBox="0 0 100 100" class="w-24 h-24 drop-shadow-lg">
                    <circle cx="50" cy="50" r="45" fill="#00529C" stroke="#E3001B" stroke-width="10" />
                    <rect x="45" y="25" width="10" height="50" fill="white" />
                    <line x1="15" y1="15" x2="85" y2="85" stroke="#E3001B" stroke-width="10" />
                </svg>
                <!-- Sign 3.30 (Even days) -->
                <svg viewBox="0 0 100 100" class="w-24 h-24 drop-shadow-lg">
                    <circle cx="50" cy="50" r="45" fill="#00529C" stroke="#E3001B" stroke-width="10" />
                    <rect x="38" y="25" width="8" height="50" fill="white" />
                    <rect x="54" y="25" width="8" height="50" fill="white" />
                    <line x1="15" y1="15" x2="85" y2="85" stroke="#E3001B" stroke-width="10" />
                </svg>
            </div>

            <h1 class="text-4xl font-bold tracking-tight text-white mb-3">Парковка</h1>
            
            <div class="mt-8 flex flex-col items-center justify-center bg-slate-800/80 backdrop-blur px-8 py-6 rounded-3xl border border-slate-700 shadow-inner w-full max-w-[280px] mx-auto">
                <span id="main-date" class="text-lg font-medium text-slate-300 mb-2">--</span>
                <div class="inline-flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="main-clock" class="text-4xl font-bold text-white font-mono tracking-widest">--:--</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Action Area -->
    <div class="fixed bottom-0 left-0 w-full z-20 pb-8 pt-12 px-6 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent flex justify-center pointer-events-none">
        <button 
            id="park-btn"
            class="pointer-events-auto btn-pulse bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-[2rem] w-full max-w-sm py-5 flex items-center justify-center gap-3 shadow-[0_0_40px_-10px_rgba(37,99,235,0.7)] transition-all duration-200 border border-blue-400/30"
            onclick="calculateParking()"
        >
            <span class="text-xl font-bold">Где парковаться?</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
    </div>

    <!-- Application Logic -->
    <script>
        // Icons
        const iconLeft = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`;
        const iconRight = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`;

        let currentTimeString = "";
        let currentDateString = "";

        // Update real-time clock and date
        function updateClock() {
            const now = new Date();
            currentTimeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            
            const dateOptions = { month: 'long', day: 'numeric', weekday: 'short' };
            currentDateString = now.toLocaleDateString('ru-RU', dateOptions);
            
            const mainClock = document.getElementById('main-clock');
            if(mainClock) mainClock.textContent = currentTimeString;

            const mainDate = document.getElementById('main-date');
            if(mainDate) mainDate.textContent = currentDateString;
        }

        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        // Main parking logic
        function calculateParking() {
            // Update time exactly when button is pressed
            updateClock();
            
            const now = new Date();
            const hour = now.getHours();
            const today = now.getDate();

            // Calculate tomorrow's date
            const tomorrowDate = new Date(now);
            tomorrowDate.setDate(now.getDate() + 1);
            const tomorrow = tomorrowDate.getDate();

            let resultText = "";
            let side = ""; // 'left' or 'right'
            let dayTypeStr = "";
            let sideTitleStr = "";

            // LOGIC
            if (hour >= 21) {
                if (tomorrow % 2 === 0) {
                    dayTypeStr = "Завтра четное число";
                    sideTitleStr = "Левая сторона";
                    resultText = "Паркуемся по левой стороне. Запаркованные справа до полуночи должны переставить автомобили.";
                    side = "left";
                } else {
                    dayTypeStr = "Завтра нечетное число";
                    sideTitleStr = "Правая сторона";
                    resultText = "Паркуемся по правой стороне. Запаркованные слева до полуночи должны переставить автомобили.";
                    side = "right";
                }
            } else {
                if (today % 2 === 0) {
                    dayTypeStr = "Сегодня четное число";
                    sideTitleStr = "Левая сторона";
                    resultText = "Паркуемся по левой стороне. (с 21 часа до полуночи перепарковываемся на правую сторону, если оставляем машину до завтра)";
                    side = "left";
                } else {
                    dayTypeStr = "Сегодня нечетное число";
                    sideTitleStr = "Правая сторона";
                    resultText = "Паркуемся по правой стороне. (с 21 до полуночи перепарковываемся на левую сторону, если оставляем машину до завтра)";
                    side = "right";
                }
            }

            // UI Update
            renderResult(sideTitleStr, dayTypeStr, resultText, side);
        }

        function renderResult(title, dayType, text, side) {
            const panel = document.getElementById('notification-panel');
            const popupDate = document.getElementById('popup-date');
            const popupTime = document.getElementById('popup-time');
            
            const sideTitle = document.getElementById('side-title');
            const dayTypeEl = document.getElementById('day-type');
            const resultText = document.getElementById('result-text');
            const sideIcon = document.getElementById('side-icon');

            // Set Date and Time in popup
            popupDate.textContent = currentDateString;
            popupTime.textContent = currentTimeString;

            // Set content
            sideTitle.textContent = title;
            dayTypeEl.textContent = dayType;
            resultText.textContent = text;

            // Set visual styling based on side
            if (side === 'left') {
                sideIcon.innerHTML = iconLeft;
                sideIcon.className = "p-4 bg-indigo-500/20 text-indigo-400 rounded-full mb-1 inline-flex items-center justify-center";
                dayTypeEl.className = "text-base font-semibold text-indigo-400 uppercase tracking-wider mb-3";
            } else {
                sideIcon.innerHTML = iconRight;
                sideIcon.className = "p-4 bg-emerald-500/20 text-emerald-400 rounded-full mb-1 inline-flex items-center justify-center";
                dayTypeEl.className = "text-base font-semibold text-emerald-400 uppercase tracking-wider mb-3";
            }

            // Show panel by removing translate-y-full
            panel.classList.remove('-translate-y-full');

            // Haptic feedback
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }
        
        function closeNotification() {
            const panel = document.getElementById('notification-panel');
            panel.classList.add('-translate-y-full');
        }
        
        // Allow swiping up on the notification to dismiss
        let touchstartY = 0;
        let touchendY = 0;
        
        const panel = document.getElementById('notification-panel');
        
        panel.addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        });

        panel.addEventListener('touchend', e => {
            touchendY = e.changedTouches[0].screenY;
            if (touchstartY - touchendY > 30) { // Swipe up
                closeNotification();
            }
        });
    </script>
</body>
</html>
