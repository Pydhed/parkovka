<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ассистент Парковки</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }
        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .sign-pulse {
            animation: subtlePulse 2s infinite ease-in-out;
        }
        @keyframes driveIn {
            0% { transform: translateY(250px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .car-animate {
            animation: driveIn 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .icon-pop {
            animation: popIn 0.5s ease-out 1.2s forwards;
            opacity: 0;
            transform: scale(0);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen w-full flex flex-col font-sans overflow-hidden relative">

    <!-- Основной экран -->
    <main class="flex-1 flex flex-col items-center pt-8 px-4 relative z-10 w-full max-w-md mx-auto">
        
        <!-- Время -->
        <div id="current-datetime" class="text-center text-slate-300 font-medium text-lg mb-6 bg-slate-800/50 py-2 px-6 rounded-full border border-slate-700 shadow-md">
            Загрузка...
        </div>

        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight text-center mb-8 drop-shadow-md">
            Нагорное шоссе
        </h1>

        <!-- Знаки -->
        <div class="flex justify-center gap-10 w-full mb-12">
            <div class="flex flex-col items-center">
                <svg viewBox="0 0 100 100" class="w-28 h-28 drop-shadow-2xl sign-pulse">
                    <circle cx="50" cy="50" r="45" fill="#0052a5" stroke="#e3000f" stroke-width="10"/>
                    <rect x="46" y="25" width="8" height="50" fill="white" />
                    <line x1="25" y1="25" x2="75" y2="75" stroke="#e3000f" stroke-width="10" stroke-linecap="square"/>
                </svg>
                <span class="text-slate-400 text-sm mt-3 font-bold tracking-wide">Нечетные (I)</span>
            </div>
            <div class="flex flex-col items-center">
                <svg viewBox="0 0 100 100" class="w-28 h-28 drop-shadow-2xl sign-pulse" style="animation-delay: 1s;">
                    <circle cx="50" cy="50" r="45" fill="#0052a5" stroke="#e3000f" stroke-width="10"/>
                    <rect x="38" y="25" width="8" height="50" fill="white" />
                    <rect x="54" y="25" width="8" height="50" fill="white" />
                    <line x1="25" y1="25" x2="75" y2="75" stroke="#e3000f" stroke-width="10" stroke-linecap="square"/>
                </svg>
                <span class="text-slate-400 text-sm mt-3 font-bold tracking-wide">Четные (II)</span>
            </div>
        </div>
    </main>

    <!-- Огромная кнопка -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md pb-8 pt-4 px-4 border-t border-slate-800 z-20 flex justify-center">
        <button onclick="openPanel()" class="w-full max-w-md bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-2xl sm:text-3xl font-extrabold py-6 rounded-2xl shadow-[0_0_40px_rgba(37,99,235,0.6)] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            ПАРКОВАТЬСЯ
        </button>
    </div>

    <!-- Всплывающая панель -->
    <div id="info-panel" class="fixed inset-0 w-full h-full bg-slate-900 z-50 transform translate-y-full transition-transform duration-500 ease-out flex flex-col items-center pt-12 px-4 pb-8 overflow-y-auto">
        
        <button onclick="closePanel()" class="absolute top-4 right-4 p-2 bg-slate-800 rounded-full text-slate-400 hover:text-white transition-colors z-50">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- Вердикт -->
        <div class="w-full max-w-lg mb-6 px-2 mt-4 flex items-center justify-center">
            <p id="verdict-text" class="text-xl sm:text-2xl text-white font-normal text-center leading-relaxed drop-shadow-md">
                <!-- Текст -->
            </p>
        </div>

        <!-- Таймер -->
        <div id="timer-container" class="text-center w-full max-w-md bg-slate-800/60 p-4 rounded-2xl border border-slate-700 mb-6">
            <div id="timer-title" class="text-xs sm:text-sm text-slate-400 uppercase tracking-widest font-bold mb-1">...</div>
            <div id="timer-value" class="text-2xl sm:text-3xl font-mono font-bold text-amber-400 drop-shadow-sm">--:--:--</div>
        </div>

        <!-- Кнопка уведомления (показывается только до 21:00) -->
        <button id="notify-btn" onclick="requestNotification()" class="hidden w-full max-w-md bg-indigo-600/90 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl mb-6 shadow-lg transition-colors border border-indigo-500">
            🔔 Напомнить в 21:00
        </button>

        <!-- Схема дороги -->
        <div class="w-full max-w-md h-64 bg-slate-600 rounded-3xl border-4 border-slate-500 flex relative overflow-hidden shadow-2xl mt-auto">
            <div class="absolute top-0 bottom-0 left-1/2 w-2 -ml-[4px] border-l-[8px] border-dashed border-slate-300 opacity-60 z-10"></div>
            
            <div class="flex-1 flex flex-col items-center justify-end relative bg-slate-800/80 pb-6">
                <div class="absolute top-3 text-slate-300 text-sm uppercase font-bold tracking-widest text-center z-20">Слева<br><span class="text-xs text-slate-400">(I)</span></div>
                <div id="left-road-content" class="w-full h-full flex flex-col items-center justify-center relative"></div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-end relative bg-slate-800/80 pb-6">
                <div class="absolute top-3 text-slate-300 text-sm uppercase font-bold tracking-widest text-center z-20">Справа<br><span class="text-xs text-slate-400">(II)</span></div>
                <div id="right-road-content" class="w-full h-full flex flex-col items-center justify-center relative"></div>
            </div>
        </div>
    </div>

    <script>
        const carSVG = `
            <svg viewBox="0 0 100 200" class="w-16 h-32 car-animate drop-shadow-xl absolute bottom-8 z-10">
                <rect x="15" y="10" width="70" height="180" rx="25" fill="#f8fafc"/>
                <rect x="20" y="40" width="60" height="35" fill="#0f172a" rx="5"/>
                <rect x="20" y="130" width="60" height="40" fill="#0f172a" rx="5"/>
                <!-- Фары -->
                <circle cx="25" cy="20" r="5" fill="#fef08a"/>
                <circle cx="75" cy="20" r="5" fill="#fef08a"/>
                <rect x="20" y="180" width="15" height="5" fill="#ef4444" rx="2"/>
                <rect x="65" y="180" width="15" height="5" fill="#ef4444" rx="2"/>
            </svg>
        `;

        const iconOk = `
            <div class="absolute top-1/2 -translate-y-1/2 bg-green-500/90 p-3 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.8)] z-20 icon-pop">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        `;

        const iconCross = `
            <div class="absolute top-1/2 -translate-y-1/2 bg-red-500/90 p-3 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.8)] z-20 icon-pop">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
        `;

        function calculateLogic() {
            const now = new Date();
            
            // Обновление даты на главном экране (по реальному времени)
            const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-datetime').textContent = `${dateStr.charAt(0).toUpperCase() + dateStr.slice(1)} • ${timeStr}`;

            const hours = now.getHours();
            const isOdd = (now.getDate() % 2 !== 0);
            const isChangeover = (hours >= 21); 

            let rawVerdict = "";
            let parkLeft = false;

            if (isChangeover) {
                let tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                let tomorrowOdd = (tomorrow.getDate() % 2 !== 0);
                
                if (tomorrowOdd) { // Значит сегодня ЧЕТНОЕ
                    rawVerdict = 'Завтра нечетное число. Паркуемся по <span class="text-yellow-400 font-bold">правой стороне</span>. Запаркованные слева до полуночи должны переставить автомобили.';
                    parkLeft = false;
                } else { // Значит сегодня НЕЧЕТНОЕ
                    rawVerdict = 'Завтра четное число. Паркуемся по <span class="text-yellow-400 font-bold">левой стороне</span>. Запаркованные справа до полуночи должны переставить автомобили.';
                    parkLeft = true;
                }
            } else {
                if (isOdd) {
                    rawVerdict = 'Сегодня нечетное число. Паркуемся по <span class="text-yellow-400 font-bold">правой стороне</span>. (с 21 до полуночи перепарковываемся на левую сторону, если оставляем машину до завтра)';
                    parkLeft = false;
                } else {
                    rawVerdict = 'Сегодня четное число. Паркуемся по <span class="text-yellow-400 font-bold">левой стороне</span>. (с 21 часа до полуночи перепарковываемся на правую сторону, если оставляем машину до завтра)';
                    parkLeft = true;
                }
            }

            document.getElementById('verdict-text').innerHTML = rawVerdict;

            // Управление кнопкой уведомлений
            const notifyBtn = document.getElementById('notify-btn');
            if (now.getHours() < 21) {
                notifyBtn.classList.remove('hidden');
                notifyBtn.classList.add('block');
            } else {
                notifyBtn.classList.add('hidden');
                notifyBtn.classList.remove('block');
            }

            return parkLeft;
        }

        function drawRoad(parkLeft) {
            const leftContainer = document.getElementById('left-road-content');
            const rightContainer = document.getElementById('right-road-content');
            
            // Очищаем перед перерисовкой
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';
            
            if (parkLeft) {
                leftContainer.innerHTML = carSVG + iconOk;
                rightContainer.innerHTML = iconCross;
            } else {
                leftContainer.innerHTML = iconCross;
                rightContainer.innerHTML = carSVG + iconOk;
            }
        }

        // Таймер (всегда считает от реального времени до следующего дедлайна)
        function updateTimerLive() {
            const now = new Date();
            let target = new Date(now);
            const isChangeover = now.getHours() >= 21;

            if (isChangeover) {
                target.setDate(target.getDate() + 1);
                target.setHours(0, 0, 0, 0);
                document.getElementById('timer-title').textContent = "До смены суток осталось:";
                document.getElementById('timer-value').className = "text-2xl sm:text-3xl font-mono font-bold text-green-400 drop-shadow-sm";
            } else {
                target.setHours(21, 0, 0, 0);
                document.getElementById('timer-title').textContent = "До начала времени перепарковки (21:00) осталось:";
                document.getElementById('timer-value').className = "text-2xl sm:text-3xl font-mono font-bold text-amber-400 drop-shadow-sm";
            }

            let diff = target - now;
            if (diff < 0) diff = 0;

            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('timer-value').textContent = 
                `${h} ч. ${m} мин. ${s} сек.`;
        }

        function requestNotification() {
            const btn = document.getElementById('notify-btn');
            if (!("Notification" in window)) {
                btn.textContent = "Уведомления не поддерживаются";
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    btn.textContent = "✓ Напоминание запланировано";
                    btn.classList.replace('bg-indigo-600/90', 'bg-green-600/90');
                    btn.classList.replace('hover:bg-indigo-500', 'hover:bg-green-500');
                    btn.classList.replace('border-indigo-500', 'border-green-500');
                    
                    // Эмуляция планирования (в реальном PWA нужен Service Worker push event)
                    // Здесь мы просто показываем визуальный фидбек
                } else {
                    btn.textContent = "✕ Нет разрешения";
                    btn.classList.replace('bg-indigo-600/90', 'bg-red-600/90');
                }
            });
        }

        function openPanel() {
            const parkLeft = calculateLogic(); 
            const panel = document.getElementById('info-panel');
            panel.classList.remove('translate-y-full');
            
            // Перезапуск анимации машинки при открытии панели
            setTimeout(() => {
                drawRoad(parkLeft);
            }, 100);
        }

        function closePanel() {
            const panel = document.getElementById('info-panel');
            panel.classList.add('translate-y-full');
            // Очищаем дорогу чтобы при следующем открытии анимация сработала
            setTimeout(() => {
                document.getElementById('left-road-content').innerHTML = '';
                document.getElementById('right-road-content').innerHTML = '';
            }, 500);
        }

        // Инициализация
        calculateLogic();
        updateTimerLive();
        setInterval(() => {
            calculateLogic();
            updateTimerLive();
        }, 1000);

        // --- PWA Офлайн режим и Манифест ---
        const manifestData = {
            "name": "Ассистент Парковки",
            "short_name": "Парковка",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [{
                "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NSIgZmlsbD0iIzAwNTJhNSIgc3Ryb2tlPSIjZTMwMDBmIiBzdHJva2Utd2lkdGg9IjEwIi8+PHJlY3QgeD0iNDYiIHk9IjI1IiB3aWR0aD0iOCIgaGVpZ2h0PSI1MCIgZmlsbD0id2hpdGUiLz48bGluZSB4MT0iMjUiIHkxPSIyNSIgeDI9Ijc1IiB5Mj0iNzUiIHN0cm9rZT0iI2UzMDAwZiIgc3Ryb2tlLXdpZHRoPSIxMCIgc3Ryb2tlLWxpbmVjYXA9InNxdWFyZSIvPjwvc3ZnPg==",
                "sizes": "512x512",
                "type": "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // Встроенный Service Worker для кеширования (офлайн)
        const swCode = `
            const CACHE_NAME = 'parking-v1';
            self.addEventListener('install', e => {
                self.skipWaiting();
            });
            self.addEventListener('activate', e => {
                self.clients.claim();
            });
            self.addEventListener('fetch', e => {
                e.respondWith(
                    fetch(e.request).catch(() => new Response('Offline mode active. Reload to update.'))
                );
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW setup failed', err));
        }
    </script>
</body>
</html>
