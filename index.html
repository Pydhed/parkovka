<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ассистент Парковки</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Парковка">
    
    <!-- Иконки для всех платформ -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo-gradient.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logo-gradient.png">
    <link rel="apple-touch-icon" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="152x152" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="167x167" href="logo-gradient.png">
    <link rel="apple-touch-icon" sizes="120x120" href="logo-gradient.png">
    
    <style>
        /* Apple-стиль шрифты и база */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: -0.015em;
        }
        
        .app {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            width: 100%;
            max-width: 28rem;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        
        .datetime {
            background: rgba(30,41,59,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 10px;
            white-space: nowrap;
        }
        
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
        }
        
        .road {
            width: 100%;
            height: 280px;
            background: #334155;
            border-radius: 24px;
            border: 3px solid #475569;
            display: flex;
            position: relative;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.45);
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .divider {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            width: 6px;
            margin-left: -3px;
            border-left: 6px dashed #94a3b8;
            opacity: 0.5;
            z-index: 10;
        }
        
        .lane {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            background: rgba(30,41,59,0.85);
            transition: all 0.5s;
            overflow: hidden;
            padding-top: 10px;
        }
        .lane.ok { background: rgba(30,41,59,1); box-shadow: inset 0 4px 0 rgba(34,197,94,0.7); }
        .lane.warn { box-shadow: inset 0 4px 0 rgba(234,179,8,0.7); }
        .lane.disabled { opacity: 0.4; }
        
        .lane-label {
            position: static;
            color: #cbd5e1;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-align: center;
            z-index: 20;
            margin-bottom: 6px;
            line-height: 1.2;
        }
        .lane-label small { font-size: 9px; color: #94a3b8; display: block; font-weight: 600; }
        
        .content { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        
        .badge {
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            background: rgba(15,23,42,0.9);
            padding: 6px 8px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.25);
            animation: textSlideIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards;
            opacity: 0;
            line-height: 1.25;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 92%;
        }
        .badge.green { color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .badge.red { color: #f87171; border: 1px solid rgba(239,68,68,0.5); background: rgba(239,68,68,0.1); }
        .badge.yellow { color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
        
        .lane-timer {
            font-size: 13px;
            font-family: "SF Mono", ui-monospace, monospace;
            font-weight: 700;
            color: #fbbf24;
            margin-top: 6px;
            text-align: center;
            background: rgba(15,23,42,0.85);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            animation: textSlideIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards;
            opacity: 0;
        }
        .lane-timer.urgent { color: #f87171; border-color: rgba(239,68,68,0.5); }
        
        /* БОЛЬШИЕ КНОПКИ МЕТРО ДО ФУТЕРА */
        .metro-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            flex: 1;
            margin-top: 14px;
            margin-bottom: 76px;
        }
        
        .metro-btn {
            flex: 1;
            padding: 16px 12px;
            border-radius: 22px;
            border: none;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 12px 24px -6px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.25);
            transition: transform 0.15s cubic-bezier(0.4,0,0.2,1), filter 0.15s;
            text-align: center;
            line-height: 1.2;
        }
        .metro-btn:active { transform: scale(0.96); filter: brightness(0.92); }
        
        .btn-bel { background: linear-gradient(145deg, #22c55e, #15803d); }
        .btn-pla { background: linear-gradient(145deg, #a855f7, #6b21a8); }
        
        .metro-btn-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.22);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .metro-btn-icon svg { width: 22px; height: 22px; fill: white; }

        /* ФУТЕР И ОБНОВИТЬ */
        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15,23,42,0.88);
            backdrop-filter: blur(16px);
            padding: 10px 16px 22px;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: center;
            z-index: 20;
        }
        .refresh-btn {
            width: 100%;
            max-width: 28rem;
            background: #334155;
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            padding: 14px;
            border-radius: 16px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .refresh-btn:active { transform: scale(0.97); background: #1e293b; }
        .refresh-btn svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 88vh;
            background: #0f172a;
            border-radius: 30px 30px 0 0;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }
        .modal.active { transform: translateY(0); }
        
        .modal-drag {
            width: 40px; height: 5px;
            background: #475569;
            border-radius: 3px;
            margin: 10px auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 14px;
            border-bottom: 1px solid #1e293b;
        }
        .modal-header h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: white; }
        
        .close-top {
            width: 32px; height: 32px;
            background: #334155;
            border-radius: 50%;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .close-top svg { width: 16px; height: 16px; stroke: #cbd5e1; stroke-width: 2.2; stroke-linecap: round; }
        
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .section-card {
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
        }
        
        /* Цветовое кодирование разделов */
        .bg-green { background: rgba(34,197,94,0.14); border: 1px solid rgba(34,197,94,0.32); }
        .bg-purple { background: rgba(168,85,247,0.14); border: 1px solid rgba(168,85,247,0.32); }
        .bg-yellow { background: rgba(234,179,8,0.14); border: 1px solid rgba(234,179,8,0.32); }
        
        .section-card h3 {
            font-size: 16px; font-weight: 700; margin-bottom: 10px; color: white;
            display: flex; align-items: center; gap: 8px;
        }
        
        .stop-block { margin-bottom: 12px; }
        .stop-block:last-child { margin-bottom: 0; }
        .stop-name { font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85; }
        
        .route-item {
            background: rgba(15,23,42,0.65);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 11px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .route-item:last-child { margin-bottom: 0; }
        .route-info { display: flex; align-items: center; gap: 10px; }
        .route-icon {
            width: 34px; height: 34px;
            background: #1e293b;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .route-icon svg { width: 19px; height: 19px; fill: #38bdf8; }
        .route-num { font-size: 18px; font-weight: 700; color: white; }
        .route-times { text-align: right; }
        .time-next { font-size: 16px; font-weight: 700; color: #4ade80; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
        .countdown { font-size: 11px; font-weight: 600; background: rgba(74,222,128,0.15); color: #4ade80; padding: 2px 6px; border-radius: 6px; }
        .time-later { font-size: 13px; color: #94a3b8; font-weight: 500; margin-top: 3px; }

        .close-bottom {
            width: 100%;
            background: #1e293b;
            color: white;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #334155;
            cursor: pointer;
        }
        .close-bottom:active { background: #334155; }

        /* Плоские стильные машинки в стиле Apple */
        @keyframes driveIn {
            0% { transform: translateY(180px); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes beamFade {
            0%, 15% { opacity: 0; }
            25%, 70% { opacity: 0.75; }
            100% { opacity: 0; }
        }
        @keyframes textSlideIn {
            0% { opacity: 0; transform: translateY(-16px) scale(0.85); }
            60% { transform: translateY(3px) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .car-wrap { position: relative; animation: driveIn 1.2s cubic-bezier(0.25,0.46,0.45,0.94) forwards; opacity: 0; }
        .beam {
            position: absolute; top: -55px; width: 28px; height: 55px;
            background: linear-gradient(to top, rgba(254,240,138,0.7), transparent);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            animation: beamFade 1.2s ease-out forwards; opacity: 0;
        }
        .beam.left { left: 8px; }
        .beam.right { right: 8px; }
    </style>
</head>
<body>
    <main class="app">
        <div id="current-datetime" class="datetime">Загрузка...</div>
        <h1>Нагорное шоссе</h1>
        <div class="road">
            <div class="divider"></div>
            <div id="left-lane" class="lane">
                <div class="lane-label">Слева<small>3.29 · чётные</small></div>
                <div id="left-road-content" class="content"></div>
            </div>
            <div id="right-lane" class="lane">
                <div class="lane-label">Справа<small>3.30 · нечётные</small></div>
                <div id="right-road-content" class="content"></div>
            </div>
        </div>

        <div class="metro-buttons">
            <button class="metro-btn btn-bel" onclick="openSchedule('belomorskaya')">
                <div class="metro-btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </div>
                Добраться до<br>м. Беломорская
            </button>
            <button class="metro-btn btn-pla" onclick="openSchedule('planernaya')">
                <div class="metro-btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </div>
                Добраться до<br>м. Планерная
            </button>
        </div>
    </main>

    <div class="footer">
        <button onclick="location.reload()" class="refresh-btn">
            <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Обновить
        </button>
    </div>

    <!-- Модальное окно расписания -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeSchedule()"></div>
    <div class="modal" id="schedule-modal">
        <div class="modal-drag"></div>
        <div class="modal-header">
            <h2 id="modal-title">Транспорт</h2>
            <button class="close-top" onclick="closeSchedule()">
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="modal-content" id="modal-body"></div>
        <div style="padding: 8px 20px 24px;">
            <button class="close-bottom" onclick="closeSchedule()">Закрыть</button>
        </div>
    </div>

        // --- ВЫЧИСЛЕНИЕ 3 БЛИЖАЙШИХ РЕЙСОВ ---
        function getNext3Departures(scheduleArray) {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            
            let parsedTrips = [];
            scheduleArray.forEach(timeStr => {
                const [h, m] = timeStr.split(':').map(Number);
                let mins = h * 60 + m;
                if (h < 4) {
                    parsedTrips.push({ totalMins: mins, timeStr, isNextDay: false });
                    parsedTrips.push({ totalMins: mins + 24 * 60, timeStr, isNextDay: false });
                } else {
                    parsedTrips.push({ totalMins: mins, timeStr, isNextDay: false });
                    parsedTrips.push({ totalMins: mins + 24 * 60, timeStr, isNextDay: true });
                }
            });
            
            parsedTrips.sort((a, b) => a.totalMins - b.totalMins);
            
            const uniqueTrips = [];
            const seen = new Set();
            for (const t of parsedTrips) {
                if (!seen.has(t.totalMins)) {
                    seen.add(t.totalMins);
                    uniqueTrips.push(t);
                }
            }
            
            const upcoming = uniqueTrips.filter(t => t.totalMins >= currentMins).slice(0, 3);
            
            return upcoming.map((t, index) => {
                const diff = t.totalMins - currentMins;
                if (index === 0) {
                    const badgeText = diff === 0 ? 'сейчас' : (diff < 60 ? `через ${diff} мин` : `утром`);
                    return `${t.timeStr} <span class="countdown">${badgeText}</span>`;
                }
                return t.timeStr;
            });
        }

                                    <div class="route-num">${route.num}</div>
                                </div>
                                <div class="route-times">
                                    <span class="time-next">${times[0] || '--:--'}</span>
                                    <div class="time-later">${times[1] || ''}${times[2] ? ', ' + times[2] : ''}</div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
                html += `</div>`;
            });

            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('schedule-modal').classList.add('active');
        }

        function closeSchedule() {
            document.getElementById('modal-overlay').classList.remove('active');
            document.getElementById('schedule-modal').classList.remove('active');
        }

        // --- ПЛОСКИЙ APPLE-ДИЗАЙН АВТОМОБИЛЯ ---
        function createCar(num, delay) {
            const d = delay ? `style="animation-delay:${delay}s"` : '';
            return `
                <div class="car-wrap" ${d}>
                    <div class="beam left" ${d}></div>
                    <div class="beam right" ${d}></div>
                    <svg viewBox="0 0 100 200" width="58" height="116" style="display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.35))">
                        <rect x="8" y="36" width="8" height="28" rx="4" fill="#1e293b"/>
                        <rect x="84" y="36" width="8" height="28" rx="4" fill="#1e293b"/>
                        <rect x="8" y="136" width="8" height="28" rx="4" fill="#1e293b"/>
                        <rect x="84" y="136" width="8" height="28" rx="4" fill="#1e293b"/>
                        <rect x="14" y="10" width="72" height="180" rx="26" fill="#f8fafc"/>
                        <rect x="22" y="54" width="56" height="92" rx="16" fill="#0f172a"/>
                        <path d="M 26 56 L 74 56 L 70 40 L 30 40 Z" fill="#38bdf8" opacity="0.85"/>
                        <path d="M 26 144 L 74 144 L 70 160 L 30 160 Z" fill="#38bdf8" opacity="0.75"/>
                        <rect x="24" y="14" width="14" height="6" rx="3" fill="#fef08a"/>
                        <rect x="62" y="14" width="14" height="6" rx="3" fill="#fef08a"/>
                        <rect x="22" y="182" width="16" height="5" rx="2.5" fill="#ef4444"/>
                        <rect x="62" y="182" width="16" height="5" rx="2.5" fill="#ef4444"/>
                    </svg>
                </div>`;
        }

        function badge(text, color) { return `<div class="badge ${color}">${text}</div>`; }

        function calculateLogic() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-datetime').textContent = `${dateStr} • ${timeStr}`;

            const isChangeover = now.getHours() >= 21;
            const todayOdd = now.getDate() % 2 !== 0;
            const currentValidLeft = !todayOdd;
            const currentValidRight = todayOdd;
            const nextValidLeft = todayOdd;
            const nextValidRight = !todayOdd;
            return { isChangeover, currentValidLeft, currentValidRight, nextValidLeft, nextValidRight };
        }

        function drawRoad({ isChangeover, currentValidLeft, currentValidRight, nextValidLeft, nextValidRight }) {
            const leftC = document.getElementById('left-road-content');
            const rightC = document.getElementById('right-road-content');
            const leftL = document.getElementById('left-lane');
            const rightL = document.getElementById('right-lane');

            leftC.innerHTML = ''; rightC.innerHTML = '';
            leftL.className = 'lane'; rightL.className = 'lane';

            if (isChangeover) {
                if (nextValidLeft) {
                    leftL.classList.add('ok');
                    leftC.innerHTML = badge('Парковка разрешена с 21:00 до следующего дня', 'green') + createCar(1, 0);
                } else {
                    leftL.classList.add('warn');
                    leftC.innerHTML = badge('Переставляем машину до 0:00', 'red') + createCar(1, 0.2) + '<div id="left-timer" class="lane-timer urgent">--:--:--</div>';
                }
                if (nextValidRight) {
                    rightL.classList.add('ok');
                    rightC.innerHTML = badge('Парковка разрешена с 21:00 до следующего дня', 'green') + createCar(2, 0);
                } else {
                    rightL.classList.add('warn');
                    rightC.innerHTML = badge('Переставляем машину до 0:00', 'red') + createCar(2, 0.2) + '<div id="right-timer" class="lane-timer urgent">--:--:--</div>';
                }
            } else {
                if (currentValidLeft) {
                    leftL.classList.add('ok');
                    leftC.innerHTML = badge('Переставить с 21:00 до 0:00', 'green') + createCar(1, 0) + '<div id="left-timer" class="lane-timer">--:--:--</div>';
                } else {
                    leftL.classList.add('disabled');
                    leftC.innerHTML = badge('Нельзя', 'red');
                }
                if (currentValidRight) {
                    rightL.classList.add('ok');
                    rightC.innerHTML = badge('Переставить с 21:00 до 0:00', 'green') + createCar(2, 0) + '<div id="right-timer" class="lane-timer">--:--:--</div>';
                } else {
                    rightL.classList.add('disabled');
                    rightC.innerHTML = badge('Нельзя', 'red');
                }
            }
        }

        function updateTimerLive() {
            const now = new Date();
            const target = new Date(now);
            const isChangeover = now.getHours() >= 21;
            
            if (isChangeover) { target.setDate(target.getDate() + 1); target.setHours(0, 0, 0, 0); } 
            else { target.setHours(21, 0, 0, 0); }
            
            let diff = Math.max(0, target - now);
            const h = Math.floor(diff / 3600000) % 24;
            const m = Math.floor(diff / 60000) % 60;
            const s = Math.floor(diff / 1000) % 60;
            const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            
            const leftTimer = document.getElementById('left-timer');
            const rightTimer = document.getElementById('right-timer');
            if (leftTimer) leftTimer.textContent = timeStr;
            if (rightTimer) rightTimer.textContent = timeStr;
        }

        let lastState = null;
        function tick() {
            const logic = calculateLogic();
            updateTimerLive();
            const currentState = `${logic.isChangeover}-${logic.currentValidLeft}-${logic.nextValidLeft}`;
            if (lastState !== currentState) {
                drawRoad(logic);
                lastState = currentState;
            }
        }

        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
